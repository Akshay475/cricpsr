apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cricpsr
  labels:
    app.kubernetes.io/part-of: cricpsr
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cricpsr.example.com
      secretName: cricpsr-tls
  rules:
    - host: cricpsr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
